[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnamining"
version = "1.1.0"
description = "Coding-potential prediction for RNA sequences"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "xgboost==3.3.0",
]

[project.optional-dependencies]
data = ["pyyaml==6.0.2"]
evaluation = ["pyyaml==6.0.2", "scikit-learn==1.9.0"]
development = ["biopython==1.87", "pandas==3.0.3"]
test = ["pytest==9.0.3"]

[project.scripts]
rnamining = "rnamining.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnamining = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
