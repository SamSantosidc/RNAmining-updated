[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnamining"
version = "1.0.4"
description = "Coding-potential prediction for RNA sequences"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
  "biopython==1.87",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "xgboost==3.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
rnamining = "rnamining.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
